name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # the common repository this port is built against: hakios-xnu-kernel at main, at the revision
  # the patch was made against (bump this when it is rebased), plus this repository laid in as
  # devices/dodge (patches/kernel-common.patch on the tree; the drivers, the ath12k stack and the Mesa
  # port from this repository itself)
  HAKIOS_REPO: https://github.com/oosexgang/hakios-xnu-kernel.git
  HAKIOS_REF: 63fc2b4633bac3af8e57dadab9f5a8d4cb940438

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils make flex bison m4 perl \
            python3 python3-pip python3-venv autoconf automake libtool \
            pkg-config clang lld llvm nasm zip uuid-dev libncurses-dev ninja-build meson gawk
          # the kernel is built with clang-20: the kernels this tree produced with
          # ubuntu-24.04's default clang-18 ran slow and wedged mid-session
          sudo apt-get install -y --no-install-recommends clang-20 lld-20 || \
            { curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg; \
              echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list; \
              sudo apt-get update -q && sudo apt-get install -y --no-install-recommends clang-20 lld-20; }
          # free the runner's own bulk early: the IPSW and the unpacked files need ~14 GB later
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/.ghcup 2>/dev/null || true

      - name: theos (the cctools ld64 and the iPhoneOS 16.5 SDK)
        run: |
          git clone -q https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain/linux/iphone"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$HOME/theos/toolchain/linux/iphone" --strip-components=2
          "$HOME/theos/toolchain/linux/iphone/bin/ld" -v | head -1
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks" && mv /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      # ---- the sources: the upstream tree, this repository's two patches and its own layers ----

      - name: sources (the upstream + the patches + this repository)
        run: |
          git clone -q "$HAKIOS_REPO" hackios
          git -C hackios checkout -q "$HAKIOS_REF"
          # this repository becomes the tree's device directory: its drivers are synced into the
          # XNU tree by the tree's own build (xnu/sync-drivers.sh reads the drivers' conf files)
          rm -rf hackios/devices/dodge && mkdir -p hackios/devices/dodge
          find . -mindepth 1 -maxdepth 1 -not -name hackios -exec cp -r {} hackios/devices/dodge/ \;
          rm -rf hackios/devices/dodge/.git
          cd hackios
          # this repository's patch on the common tree: everything the port changes in it (the same one
          # apply-kernel-patches.sh puts on the local tree)
          git apply --whitespace=nowarn devices/dodge/patches/kernel-common.patch
          # the ath12k station stack (wifi/ of this repository; the object is built below)
          rm -rf wifi/ath12k && cp -r devices/dodge/wifi/ath12k wifi/ath12k
          # the upstream's own XNU patch and files/, then the kernel build's dependencies
          # (the SDK, the host tools, the stage-2 libraries; the committed xnu-clang wrapper
          # satisfies its guard -- idempotent, uses the theos above)
          xnu/apply.sh
          # this repository's patch on Apple's XNU tree: the fixes the phone's kernel needs (the IO submap,
          # the NULL processors skipped, the boot line -- without them the kernel panics or freezes on the
          # phone; the same one docker/build.sh applies locally)
          devices/dodge/tools/xnu-patch.sh .
          xnu-deps/setup.sh

      - name: checks (the tree's own consistency, the same ones locally)
        run: |
          cd hackios
          python3 tools/hakios-device.py check     # every device repository holds together
          python3 tools/drivers-check.py           # drivers/map against the tree and the confs
          python3 tools/boot-args.py --check       # the generated lists are in step with the source
          # the WCN7850's firmware this repository carries, and the loader's table of it (in the patches): the
          # loader looks for each revision's bytes where the table says, in the one image the host stages
          python3 devices/dodge/tools/compose_combined.py --check .

      # ---- the ath12k object: FreeBSD's LinuxKPI pulled from FreeBSD's own archive; cached ----

      - name: restore the ath12k object (cache)
        id: ath12k-cache
        uses: actions/cache/restore@v4
        with:
          path: hackios/xnu-deps/build/ath12k
          key: ath12k-${{ hashFiles('wifi/ath12k/**', 'tools/mk-ath12k.sh') }}
      - name: ath12k (the station stack the kernel links)
        if: steps.ath12k-cache.outputs.cache-hit != 'true'
        run: |
          cd hackios
          export PATH="$PWD/xnu-deps/host/bin:/usr/lib/llvm-20/bin:$PATH" LC_ALL=C
          devices/dodge/tools/mk-ath12k.sh
          ls -la xnu-deps/build/ath12k/out/
      - name: save the ath12k object (cache)
        if: steps.ath12k-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hackios/xnu-deps/build/ath12k
          key: ath12k-${{ hashFiles('wifi/ath12k/**', 'tools/mk-ath12k.sh') }}

      - name: kernel
        run: |
          cd hackios
          export LC_ALL=C
          export PATH="/usr/lib/llvm-20/bin:$PATH"    # clang-20: see the install step
          make dodge_defconfig
          make kernel JOBS=$(nproc) || true    # a trailing target after mach.* may fail
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          [ -s "$K" ] || { echo "--- the kernel was not built"; exit 1; }
          cp "$K" hakios-kernel
          cp hakios-kernel kernel.bin
          # ath12k must be linked: without it the kernel comes out 565 KB smaller and
          # every address shifts -- a kernel that lost it must fail the build
          N=$(strings -a hakios-kernel | grep -c "ath12k\|OnePlus13 Peach")
          [ "$N" -ge 100 ] || { echo "--- ath12k NOT linked ($N markers): the kernel would not boot as built"; exit 1; }
          echo "ath12k: linked, $N markers"

      # ---- the IPSW's address is looked up at run time, never hardcoded: the iPhone Wiki's ----
      # ---- API for the exact build Darwin userland 16.5 was made for (20F66, iPhone10,6)     ----

      - name: the IPSW's address (resolved, not hardcoded)
        run: |
          python3 -c "
          import json, urllib.request
          d = json.load(urllib.request.urlopen('https://api.ipsw.me/v4/device/iPhone10,6?type=ipsw', timeout=120))
          fw = next(f for f in d['firmwares'] if f['buildid'] == '20F66')
          print('IPSW_URL=' + fw['url'])
          print('IPSW_SHA1=' + fw['sha1sum'])
          " | tee -a "$GITHUB_ENV"
          grep -q "^IPSW_URL=https://" "$GITHUB_ENV" || { echo "no IPSW_URL resolved"; exit 1; }

      # ---- the loader: with the real identity from the start.  The device tree is one 34 KB ----
      # ---- member of the IPSW on Apple's CDN; tools/fetch-from-ipsw.py (carried from the     ----
      # ---- common repository's legacy branch) reads it with HTTP ranges -- no full download, ----
      # ---- no 7z, no disk: the big parts of the firmware are fetched only at the image step. ----

      - name: loader (the real identity, once)
        run: |
          python3 -m pip install --user --break-system-packages lzfse 2>/dev/null || python3 -m pip install --user lzfse
          cd hackios
          python3 devices/dodge/tools/fetch-from-ipsw.py Firmware/all_flash/DeviceTree.d22ap.im4p sysimage/DeviceTree.d22ap.im4p
          xnuloader/mkidentity.sh
          make loader

      # ---- the UEFI firmware: cached, the clone + build is the slowest part after the kernel ----

      - name: restore the UEFI tree (cache)
        id: uefi-cache
        uses: actions/cache/restore@v4
        with:
          path: hackios/Mu-Silicium
          key: uefi-dodge-${{ hashFiles('uefi/**') }}
          restore-keys: uefi-dodge-
      - name: drop a stale UEFI tree (restored from another revision)
        if: steps.uefi-cache.outputs.cache-hit != 'true'
        run: rm -rf hackios/Mu-Silicium
      - name: UEFI (Mu-Silicium + the port)
        run: |
          cd hackios && devices/dodge/uefi/apply.sh
          python3 -m venv venv
          venv/bin/pip -q install -r Mu-Silicium/pip-requirements.txt
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep     # mu_nasm without Mono
          mkdir -p "$D/Linux-x-64" && echo 'version: 20016.1.1' > "$D/extdep_state.yaml"
          ln -sf /usr/bin/nasm "$D/Linux-x-64/nasm"               # -f: a restored tree has them
          ln -sf /usr/bin/ndisasm "$D/Linux-x-64/ndisasm"
          ( cd Mu-Silicium && ../venv/bin/python3 build_uefi.py -d dodge -r RELEASE )
          ls -la Mu-Silicium/Build/dodgePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
      - name: save the UEFI tree (cache)
        if: steps.uefi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: hackios/Mu-Silicium
          key: uefi-dodge-${{ hashFiles('uefi/**') }}

      - name: "boot image (once -- real kernel, real loader, real FD)"
        run: |
          cd hackios
          python3 xnuloader/mkpayload.py -o usb-payload.bin loader.efi=xnuloader/loader.efi --usb
          # a wrong UEFI_FD would silently fall back to the reference phone's prebuilt and not boot here
          UEFI_FD=Mu-Silicium/Build/dodgePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd \
            DTB=Mu-Silicium/Resources/DTBs/dodge.dtb \
            FD_BASE=0xA7100000 FD_SIZE=0x300000 PAYLOAD_BASE=0xF0000000 BOOT_HEADER=4 \
            python3 mkxnuimg.py -p usb-payload.bin -o boot.img
          ls -la boot.img kernel.bin

      # ---- the system image: ~8 GB of Apple's CDN and unpacking, the flakiest part -- so it ----
      # ---- sits after everything of ours is built, and only the package waits on it ----

      - name: free the disk for the system image
        run: |
          df -h / /mnt || true
          rm -rf hackios/xnu-src/xnu-8796.121.2/BUILD hackios/xnu-src/xnu-8796.121.2/.git
          rm -rf hackios/Mu-Silicium hackios/venv        # the boot image above consumed the FD
          df -h / /mnt || true

      # ---- Mesa: the whole 1171-target cross build is ~15 minutes on a fresh runner; its own ----
      # ---- stamps (the port patch's hash, the venv, meson's build-26) make a restored tree     ----
      # ---- build nothing and just re-verify -- so it is cached like the ath12k object          ----

      - name: restore the Mesa build (cache)
        id: mesa-cache
        uses: actions/cache/restore@v4
        with:
          path: hackios/xnu-deps/build/mesa
          key: mesa-dodge-${{ hashFiles('mesa-files/**') }}

      - name: system image (the IPSW from Apple's CDN, the GL build)
        run: |
          curl -fsSL https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz | tar -xJ -C /tmp
          sudo ln -sf /tmp/7zz /usr/local/bin/7z && 7z | head -3
          curl -fsSL --retry 3 -o /tmp/ipsw.zip "$IPSW_URL"
          echo "$IPSW_SHA1  /tmp/ipsw.zip" | sha1sum -c -
          cd hackios
          export PATH="/usr/lib/llvm-20/bin:$PWD/xnu-deps/host/bin:$HOME/theos/toolchain/linux/iphone/bin:$PATH" LC_ALL=C THEOS=$HOME/theos
          # (llvm-20 first: the tree's xnu-clang wrapper passes --ld-path, which older clangs refuse;
          #  the toolchain's bin carries ldid for the test programs)
          make unpack IPSW=/tmp/ipsw.zip > /tmp/unpack.log 2>&1 \
            || { echo '--- unpack failed, tail:'; tail -40 /tmp/unpack.log; exit 1; }
          rm -f /tmp/ipsw.zip
          # this phone's firmware, carried in the repository so the CI's package works
          # out of the box (refreshed from the phone by devices/dodge/pull-firmware.sh):
          # the GPU's images (without them the kernel's GPU bring-up stops at its step 9),
          # the audio DSP's (the speakers and the battery's GLINK ride it), the Bluetooth
          # set, the WCN7850's (combined.bin -- both revisions' sets, peach and peach_v2 -- is what the host
          # stages and the loader's MHI download takes the chip's revision's set of),
          # and the Iris VPU's (vpu35_4v.mbn: the H.264/HEVC hardware decoder's image)
          for d in fw-gpu fw-audio fw-bt fw-wifi fw-video; do
            [ -d devices/dodge/$d ] && rm -rf $d && cp -r devices/dodge/$d $d
          done
          # the images, GL and REST required: GL for Mesa 26.2.5 with Freedreno
          # (devices/dodge/mesa-files; mk-mesa26.sh pulls Mesa's own tarball and ios-dodge's
          # patch does the porting); REST for the rest of our programs -- bluetool among them,
          # without which bluetoothd is never driven and a scan finds nothing
          # (the library names are the tree's own: libhakios.*)
          IMAGE_OPTS="GL=1 REST=1" make images > /tmp/gl.log 2>&1 \
            || { echo '--- GL=1 images failed, tail:'; tail -40 /tmp/gl.log; exit 1; }
          # what a broken image would be missing (a disk-full mid-image once shipped green);
          # launchd.darwin is the real Darwin launchd as this tree names it (build.sh:795 renames
          # sbin/launchd to it; the older trees called it launchd.ios)
          strings userland/system.apfs | grep -q launchd.darwin \
            || { echo '--- system.apfs has no launchd.darwin: the image is incomplete'; exit 1; }
          strings userland/root.apfs | grep -q gen80000_gmu \
            || { echo '--- root.apfs has no GPU firmware: the image is incomplete'; exit 1; }
          strings userland/root.apfs | grep -q vpu35_4v \
            || { echo '--- root.apfs has no VPU firmware (vpu35_4v.mbn): the hardware video decoder would have nothing to load'; exit 1; }
          strings userland/root.apfs | grep -q libhakios.dylib \
            || { echo '--- root.apfs has no injection libraries: the image is incomplete'; exit 1; }
          strings userland/root.apfs | grep -q libhakios.gl.dylib \
            || { echo '--- root.apfs has no GL library: the image is incomplete'; exit 1; }
          # bluetool: BlueTool's replacement in the small image, without which bluetoothd is never driven
          # (the CI's clean tree shipped without it once: its copy waited on a file only an earlier build left)
          strings userland/root.apfs | grep -q bluetool \
            || { echo '--- root.apfs has no bluetool: bluetoothd would never be driven'; exit 1; }

      - name: save the Mesa build (cache)
        uses: actions/cache/save@v4
        with:
          path: hackios/xnu-deps/build/mesa
          key: mesa-dodge-${{ hashFiles('mesa-files/**') }}

      - name: package (the one zip, everything in it)
        run: |
          cd hackios
          ( cd devices/dodge && ./package.sh )
          echo "== the dist, where the zip must be:"
          ls -la devices/dodge/dist/ || { echo "no dist under devices/dodge"; find .. -name 'hakios-dodge-*.zip' -newer /tmp/marker 2>/dev/null; }
          touch /tmp/marker
          python3 -m zipfile -l devices/dodge/dist/hakios-dodge-*.zip | tail -4
          # without the WCN7850's image beside the launcher, the zip boots without the Wi-Fi bring-up
          python3 -m zipfile -l devices/dodge/dist/hakios-dodge-*.zip | grep -q -E '/combined\.bin[[:space:]]' \
            || { echo '--- the zip has no combined.bin: it would boot without the Wi-Fi bring-up'; exit 1; }

      # ---- publish: one artifact, and the same zip on a tag ----

      - uses: actions/upload-artifact@v7
        with:
          name: hakios-dodge
          path: hackios/devices/dodge/dist/hakios-dodge-*.zip
          if-no-files-found: error
          archive: false      # the zip as it is: no second compression around it

      - name: release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" hackios/devices/dodge/dist/hakios-dodge-*.zip \
            --title "${GITHUB_REF#refs/tags/}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
