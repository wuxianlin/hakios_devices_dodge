# devices/dodge/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word. The device's page in the documentation is made from it, so the status is said in one place.

device dodge
	title       OnePlus 13 (dodge)
	vendor      OnePlus
	soc         sun
	defconfig   dodge_defconfig
	firmware    pull-firmware.sh
	maintainer  wuxianlin
	status      display     works     the framebuffer through the loader, and the brightness: the display AHB clock voted and the DSI page mapped before XNU (ios-dodge's protocol recipe), /dev/brightness answers DCS51 -- the sliders dim and brighten the panel
	status      touch       works     Synaptics S3910 on bit-banged GPIO SPI, TouchCom: multitouch, edge gestures, 125 Hz (CONFIG_HAKIOS_DODGE_TOUCH, synaptics=1)
	status      buttons     works     power from the PON, volume down from PM8550VS GPIO6 through the v7 arbiter's write side, volume up is resin (CONFIG_HAKIOS_BUTTONS, buttons_pin=0x18d buttons_swap=1)
	status      cpu         partial   four cores by default (cpus=4, the proven boot); all eight have been booted (cpus=8) but are not this configuration's
	status      audio       works     the speakers play: the audio DSP adopted, the AudioReach graph (WRSH-DEC-CNV-VOL-MFC-LOG-I2S_SINK) through glink adsp_apps, both AW88230 amplifiers in Android's own playing state on i2s1, true stereo, DONEs flowing at the real-time rate (sound=4 sound_pins=1; the volume is iOS's software mode, the guard protects the speakers)
	status      wifi        works     the WCN7850 up through the loader's full MHI bring-up and adopted by the kernel over the lease (wifi=1, the loader-side sequence; the link and DHCP work); either revision of the chip an OnePlus 13 carries, peach or peach_v2 -- the loader tells them by the chip's own second aperture before anything is downloaded and takes that revision's set out of the one staged image (fw-wifi/combined.bin); seen on a phone of each revision (peach: joined 6.8 s after the kernel began on the radio, an address over DHCP, traffic on en0; peach_v2: joined 9.5 s in, iOS's Wi-Fi mark in its status bar)
	status      battery     works     the level, health and charging state through the audio DSP's GLINK (batt_dsp=4), the DSP itself kept up and voted (adsp_keepvotes=1)
	status      gpu         works     Adreno 830: hardware GL through Mesa (adreno8=23 gl=1), the loader's secure preflight and the recovery path in; the table of IOSurface textures no longer runs out (the black rectangles); the driver with the K90 port's fixes (buffers and their ranges, the page tables' count, a context that waits for long submissions, the hang report), Mesa with the K90 port's rebase-26 fixes and the GL bridge with ios-dodge's glyph spans
	status      storage     missing   UFS not brought up; the kernel runs from RAM
	status      torch       works     the flashlight from the camera driver's rails (torch=3)
	status      bluetooth   works     over PCIe (bt=4 pcie_bt_en=1, its NVM loaded)
	status      sensors     partial   the alert slider's three positions through the PMIC's accelerometer pole (slider=1 slider_power=1); no other sensors yet
	status      camera      partial   the video half works: the Iris VPU decodes H.264/HEVC (PAS 9 authenticated, HFI Gen2 online, the VideoToolbox plugin, hvc1 seen playing); the still camera itself (the ISP pipeline, the sensors) is not brought up
	status      haptic      works     the PMIH010x hv-haptics block over SPMI: iOS Actuator waveforms played directly (haptic=4), K90's shapes, this phone's motor (7692 us, 2400 mV)
	status      cellular    missing   the modem is not started; soc.args carries the IPA's addresses for when it is
	status      network     missing
	status      thermal     missing
